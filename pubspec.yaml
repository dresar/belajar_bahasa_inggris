name: belajar_bahasa_inggris
description: "Aplikasi Game Edukasi Bahasa Inggris Modern"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  just_audio: ^0.9.42
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.4
  shimmer: ^3.0.0
  gap: ^3.0.1
  postgres: ^3.4.5
  path_provider: ^2.1.5
  crypto: ^3.0.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/json/config/
    - assets/json/chapters/
    - assets/json/games/
    - assets/json/achievements/
    - assets/images/
    - assets/images/grades/
    - assets/images/icons/
    - assets/images/illustrations/
    - assets/images/avatars/
    - assets/images/onboarding/
    - assets/audio/
    - assets/audio/pronunciation/
    - assets/audio/effects/
    - assets/audio/music/
    - assets/lottie/
